<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Basic English 850</title>
<style>
  :root{
    --bg:#eef0f7; --surface:#fff; --primary:#6366f1; --primary-press:#4f46e5;
    --text:#1e293b; --muted:#94a3b8; --line:#e7e9f2; --good:#22c55e; --bad:#ef4444;
    --radius:16px; --shadow:0 6px 18px rgba(0,0,0,.08);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
  #app{width:100%;max-width:480px;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative}
  #view{flex:1;overflow-y:auto;padding:16px 16px 84px}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;width:100%;cursor:pointer}
  .btn:active{background:var(--primary-press)}
  .btn.secondary{background:#eef2ff;color:var(--primary-press)}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .pill{display:inline-block;background:#eef2ff;color:var(--primary-press);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600}
  /* 底部标签栏 */
  #tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:64px;background:var(--surface);z-index:10;
    border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}
  #tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;padding:6px}
  #tabbar a .ico{display:block;font-size:22px;line-height:1}
  #tabbar a.active{color:var(--primary)}
  /* 目标圆环 */
  .ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;
    background:conic-gradient(var(--primary) var(--pct,0%), var(--line) 0)}
  .ring > div{width:96px;height:96px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* 选项按钮、答题反馈、日历、词条等的样式在对应任务中追加到此 <style> */
  .opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:10px;font-size:16px;cursor:pointer}
  .opt.correct{border-color:var(--good);background:#f0fdf4}
  .opt.wrong{border-color:var(--bad);background:#fef2f2}
  .token{display:inline-block;background:#eef2ff;border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;margin:4px;font-size:16px;cursor:pointer}
  .feedback{padding:12px;border-radius:12px;margin-top:12px;font-weight:600}
  .feedback.ok{background:#f0fdf4;color:#15803d}.feedback.no{background:#fef2f2;color:#b91c1c}
  .progressbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
  .progressbar>div{height:100%;background:var(--primary)}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:6px 12px;margin:0 6px 8px 0;font-size:13px;cursor:pointer;background:var(--surface)}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .wordrow{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
  .search{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;margin-bottom:12px;font-size:15px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--line);cursor:pointer}
  .cal-cell.done{background:var(--primary);color:#fff;font-weight:700}
  .cal-cell.today{outline:2px solid var(--primary-press)}
  .cal-cell.empty{background:transparent;cursor:default}
  .cal-cell.perfect{background:#f59e0b;color:#fff}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .ach-group{font-size:13px;color:var(--muted);font-weight:700;margin:14px 2px 8px}
  .ach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .ach-tile{text-align:center;cursor:pointer}
  .ach-ico{width:54px;height:54px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--primary);color:#fff;position:relative}
  .ach-tile.locked .ach-ico{background:var(--line);color:#b6bccc}
  .ach-name{font-size:11px;color:var(--text)}
  .ach-tile.locked .ach-name{color:var(--muted)}
  .ach-count{position:absolute;bottom:-3px;right:-3px;background:#1e293b;color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:0 5px}
  .ach-prog{font-size:10px;font-weight:700;line-height:1.05}
  .ach-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .dictbar{display:flex;gap:8px;margin-bottom:10px}
  .dictbar .dchip{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:13px;cursor:pointer;background:var(--surface)}
  .dictbar .dchip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>
