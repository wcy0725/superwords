<!doctype html>
<html lang="ja" data-theme="night" data-lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界エイズデー 2026</title>
<meta name="description" content="World AIDS Day, 1 December 2026. A ribbon drawn from 41,000 dots: each dot is 1,000 people living with HIV. 日本語 / English / 中文. Prints as an A3 poster at 300 dpi.">
<meta name="theme-color" content="#17040a">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317040a'/%3E%3Cpath d='M20 58 40 22a9 9 0 1 0-16 0l20 36' fill='none' stroke='%23ff3d44' stroke-width='8' stroke-linejoin='round'/%3E%3C/svg%3E">

<!-- ============================================================
     Shared styles: tokens, type, components. No layout here.
     Everything inside .poster is sized in --u (1/297 of the sheet
     width), so the screen is a true-to-scale preview of the print.
     ============================================================ -->
<style id="css-base">
:root[data-theme="night"], .poster[data-theme="night"] {
  --page: #17040a; --bg: #17040a;
  --fg: #fff3ea; --fg2: rgba(255, 243, 234, .74); --fg3: rgba(255, 243, 234, .52);
  --red: #ff4048; --on: #ff4048; --off: #b4bcdc; --mem: #ffd0bd;
  --rule: rgba(255, 243, 234, .2); --rule2: rgba(255, 243, 234, .46); --wash: rgba(255, 243, 234, .07);
  --glow: 0 0 .7em rgba(255, 64, 72, .9);
}
:root[data-theme="paper"], .poster[data-theme="paper"] {
  --page: #ffffff; --bg: #ffffff;
  --fg: #000000; --fg2: #3a3a3a; --fg3: #6a6a6a;
  --red: #c7001f; --on: #c7001f; --off: #3d3d3d; --mem: #8f8f8f;
  --rule: rgba(0, 0, 0, .22); --rule2: rgba(0, 0, 0, .55); --wash: rgba(0, 0, 0, .05);
  --glow: none;
}
:root, .poster {
  --f-num: Bahnschrift, "DIN Alternate", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
}
:root[data-lang="ja"], .poster[data-lang="ja"] {
  --f-text: Bahnschrift, "Avenir Next", "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
}
:root[data-lang="zh"], .poster[data-lang="zh"] {
  --f-text: Bahnschrift, "Avenir Next", "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
}
:root[data-lang="en"], .poster[data-lang="en"] {
  --f-text: Bahnschrift, "Avenir Next", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
}

:root[data-theme="night"] { color-scheme: dark; }
:root[data-theme="paper"] { color-scheme: light; }
*, *::before, *::after { box-sizing: border-box; }
::selection { background: var(--red); color: #fff; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--fg); font-family: var(--f-text); }

.poster {
  position: relative; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: var(--f-text); font-weight: 400; font-kerning: normal;
  font-size: calc(var(--u) * 3.7); line-height: 1.62;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.poster[data-lang="en"] { line-height: 1.42; }
.poster :where(h1, h2, h3, h4, p, ul, ol, figure) { margin: 0; padding: 0; font: inherit; }
.poster ul { list-style: none; }
.poster b, .poster strong { font-weight: 800; }
.poster[data-lang="en"] b, .poster[data-lang="en"] strong { font-weight: 700; }
.poster a { color: inherit; text-decoration: none; }

.num { font-family: var(--f-num); font-stretch: 75%; font-weight: 700; }
.small { font-size: calc(var(--u) * 3); line-height: 1.55; color: var(--fg2); }
.poster[data-lang="en"] .small { line-height: 1.38; }

/* operators are drawn, not typed: identical in every font and language */
.op { display: inline-block; width: .72em; height: .72em; vertical-align: -.06em; fill: none; stroke: currentColor; stroke-width: 7.5; stroke-linecap: butt; }

/* swatches that mirror the marks in the dot art */
.mark { display: inline-block; flex: none; width: .66em; height: .66em; border-radius: 50%; vertical-align: -.02em; }
.mark--on { background: var(--on); box-shadow: var(--glow); }
.mark--off { border: .13em solid var(--off); }
.mark--unk { border: .13em solid var(--off); opacity: .5; }
.mark--mem { width: .34em; height: .34em; background: var(--mem); opacity: .8; margin: 0 .16em; }

/* ---------- hero ---------- */
.art canvas { display: block; width: 100%; height: 100%; position: relative; }
.art .glow { position: absolute; inset: 0; pointer-events: none; }
.poster[data-theme="paper"] .glow { display: none; }
.art__print { display: none !important; }
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.leaders line { stroke: var(--rule2); stroke-width: .28; }
.leaders circle { fill: var(--fg); }

.title__date { line-height: .76; letter-spacing: -.012em; white-space: nowrap; font-size: calc(var(--u) * var(--fit-date, 60)); }
.title__name { line-height: 1.12; font-weight: 900; white-space: nowrap; font-size: calc(var(--u) * var(--fit-name, 13)); margin-top: calc(var(--u) * 1.6); }
.poster[data-lang="en"] .title__name { font-family: var(--f-num); font-stretch: 75%; font-weight: 700; letter-spacing: .005em; }
.title__name > span, .title__date > span { display: inline-block; }
.title__when { margin-top: calc(var(--u) * 3.2); font-size: calc(var(--u) * 4.1); line-height: 1.3; color: var(--fg2); display: flex; align-items: center; gap: calc(var(--u) * 2.2); flex-wrap: wrap; }
.pill { font-size: calc(var(--u) * 3); font-weight: 800; color: var(--bg); background: var(--fg); border-radius: 99em; padding: .12em .8em .16em; white-space: nowrap; }
.title__theme { margin-top: calc(var(--u) * 6.4); }
.title__theme .lbl { display: block; font-size: calc(var(--u) * 2.9); color: var(--fg3); line-height: 1.4; }
.title__theme strong { display: block; font-size: calc(var(--u) * 5.4); line-height: 1.32; font-weight: 800; }

.story h2 { font-size: calc(var(--u) * 9.3); line-height: 1.2; font-weight: 900; letter-spacing: -.01em; }
.poster[data-lang="en"] .story h2 { font-weight: 700; font-size: calc(var(--u) * 9.6); line-height: 1.08; letter-spacing: -.012em; }
.story p { margin-top: calc(var(--u) * 2.6); }
.story h2 + p { margin-top: calc(var(--u) * 3.6); }
.story .live { color: var(--fg); transition: opacity 1.2s; }
.story .live b { font-family: var(--f-num); font-weight: 700; font-size: 1.25em; font-variant-numeric: tabular-nums; }

.call__pct { display: flex; align-items: baseline; gap: calc(var(--u) * 1.6); font-family: var(--f-num); font-stretch: 75%; font-weight: 700; font-size: calc(var(--u) * 22); line-height: .86; }
.call__pct .mark { font-size: calc(var(--u) * 7); align-self: center; }
.call__pct small { font-size: .5em; margin-left: -.14em; }
.call__txt { margin-top: calc(var(--u) * 2.2); font-size: calc(var(--u) * 4.1); line-height: 1.34; font-weight: 800; }
.poster[data-lang="en"] .call__txt { font-weight: 700; }
.call__txt b { display: block; font-family: var(--f-text); font-weight: 900; font-size: 1.5em; line-height: 1.2; white-space: nowrap; }
.poster[data-lang="en"] .call__txt b { font-weight: 700; }
.call .small { margin-top: calc(var(--u) * 1.8); }

.btn {
  appearance: none; font: inherit; font-size: calc(var(--u) * 3.2); font-weight: 800; line-height: 1.2; color: var(--fg);
  background: transparent; border: calc(var(--u) * .3) solid var(--rule2); border-radius: 99em;
  padding: calc(var(--u) * 1.5) calc(var(--u) * 3.4) calc(var(--u) * 1.7); margin-top: calc(var(--u) * 3.2); cursor: pointer; text-align: left;
}
.btn:hover { background: var(--wash); border-color: var(--fg); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.poster :focus-visible { outline: calc(var(--u) * .5) solid var(--red); outline-offset: calc(var(--u) * .6); }

.legend { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--u) * .6) calc(var(--u) * 4.2); font-size: calc(var(--u) * 3); line-height: 1.4; color: var(--fg2); }
.legend li { display: flex; align-items: center; gap: calc(var(--u) * 1.3); white-space: nowrap; }
.legend li:first-child { color: var(--fg); font-weight: 800; }

.lens { position: absolute; left: 0; top: 0; border-radius: 50%; border: 1px solid var(--rule2); pointer-events: none; opacity: 0; transition: opacity .25s; will-change: transform; }
.tip { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; z-index: 3;
  display: flex; align-items: center; gap: .55em; font-size: calc(var(--u) * 3.1); line-height: 1.2; font-weight: 800;
  color: var(--fg); background: var(--bg); border: 1px solid var(--rule2); border-radius: 99em; padding: .5em 1em .56em; }
.tip b { font-family: var(--f-num); font-weight: 700; font-size: 1.15em; }
.tip span + span { color: var(--fg2); font-weight: 500; }

/* ---------- know ---------- */
.eq { display: flex; align-items: center; gap: .16em; font-family: var(--f-num); font-stretch: 75%; font-weight: 700; font-size: calc(var(--u) * 14.5); line-height: 1; letter-spacing: .005em; }
.eq .op { color: var(--red); }
.eqh { display: flex; align-items: center; gap: calc(var(--u) * 2.4); font-size: calc(var(--u) * 5.6); line-height: 1.24; font-weight: 900; min-height: calc(var(--u) * 14.5); }
.poster[data-lang="en"] .eqh { font-weight: 700; font-size: calc(var(--u) * 6); line-height: 1.1; }
.eqh .op { font-size: calc(var(--u) * 14.5); color: var(--red); flex: none; }
.eqh .big { font-family: var(--f-num); font-stretch: 75%; font-weight: 700; font-size: 2.1em; line-height: .8; vertical-align: -.08em; margin: 0 .04em; }
.k > p, .k > ul { margin-top: calc(var(--u) * 3); }
.routes li { display: grid; grid-template-columns: auto 1fr; column-gap: calc(var(--u) * 2.2); align-items: baseline; padding: calc(var(--u) * 1.15) 0; border-top: calc(var(--u) * .2) solid var(--rule); }
.routes li:last-child { border-bottom: calc(var(--u) * .2) solid var(--rule); }
.routes b { font-size: calc(var(--u) * 4.4); white-space: nowrap; }
.routes span { color: var(--fg2); font-size: calc(var(--u) * 3.3); line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1.5); }
.chips button {
  appearance: none; font: inherit; font-size: calc(var(--u) * 3.5); font-weight: 800; line-height: 1.2; color: var(--fg); cursor: pointer;
  background: transparent; border: calc(var(--u) * .25) solid var(--rule2); border-radius: 99em; padding: calc(var(--u) * .95) calc(var(--u) * 2.7) calc(var(--u) * 1.15);
}
.poster[data-lang="en"] .chips button { font-weight: 700; }
.chips button:hover { background: var(--wash); }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.why { margin-top: calc(var(--u) * 2.6) !important; min-height: 3.1em; }

/* ---------- act: a timeline, because this part really is a sequence ---------- */
.act__h { font-size: calc(var(--u) * 4.4); line-height: 1.2; font-weight: 900; }
.poster[data-lang="en"] .act__h { font-weight: 700; }
.s { position: relative; border-top: calc(var(--u) * .3) solid var(--fg); padding-top: calc(var(--u) * 2.6); }
.s::before { content: ""; position: absolute; left: 0; top: calc(var(--u) * -1.15); width: calc(var(--u) * 2); height: calc(var(--u) * 2); border-radius: 50%; background: var(--fg); }
.s h4 { font-size: calc(var(--u) * 5); line-height: 1.1; font-weight: 900; display: flex; align-items: baseline; gap: .12em; min-height: calc(var(--u) * 11.5); }
.poster[data-lang="en"] .s h4 { font-weight: 700; font-size: calc(var(--u) * 5.4); gap: .22em; }
.s h4 b { font-family: var(--f-num); font-stretch: 75%; font-weight: 700; font-size: calc(var(--u) * 13.5); line-height: .8; }
.s p, .s li { font-size: calc(var(--u) * 3.55); }
.s li + li { margin-top: calc(var(--u) * 1.4); }
.s .cap { font-size: calc(var(--u) * 2.6); line-height: 1.3; color: var(--fg3); margin: calc(var(--u) * 1) 0 calc(var(--u) * 2); }
.dots { display: block; width: 100%; height: auto; overflow: visible; }
.dots text { font-family: var(--f-text); font-size: 2.3px; fill: var(--fg3); font-weight: 400; }
.dots .d72 { fill: var(--on); }
.dots .w-off { fill: none; stroke: var(--fg3); stroke-width: .34; }
.dots .w-on { fill: var(--fg); }
.dots .w-end { fill: none; stroke: var(--fg); stroke-width: .34; }
.dots .w-lbl { fill: var(--fg); font-weight: 800; }
.dots .w-bracket { fill: none; stroke: var(--fg3); stroke-width: .22; }
.uu .eq { font-size: calc(var(--u) * 16); }
.uu__cap { margin-top: calc(var(--u) * 2.2); font-size: calc(var(--u) * 3.7); line-height: 1.32; font-weight: 800; }
.poster[data-lang="en"] .uu__cap { font-weight: 700; }
.s4 h4 { min-height: 0; margin-bottom: calc(var(--u) * 2.2); }
.chart { position: relative; }
.s4 > p { margin-top: calc(var(--u) * 2.6); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--f-text); font-size: 2.35px; fill: var(--fg3); font-weight: 400; }
.chart .grid { stroke: var(--rule); stroke-width: .14; }
.chart .zone { fill: var(--wash); }
.chart .thr { stroke: var(--fg); stroke-width: .2; stroke-dasharray: .9 .7; }
.chart .thr-t { fill: var(--fg); font-weight: 800; }
.chart .line { fill: none; stroke: var(--on); stroke-width: .5; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--on); stroke: var(--bg); stroke-width: .32; }
.chart .cross { stroke: var(--fg); stroke-width: .16; opacity: 0; }
.chart .hot { fill: var(--fg); stroke: var(--bg); stroke-width: .45; opacity: 0; }
.chart.is-hover .cross, .chart.is-hover .hot { opacity: 1; }
.chart .ctip { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; white-space: nowrap; font-size: calc(var(--u) * 2.7); line-height: 1.2; font-weight: 800; color: var(--bg); background: var(--fg); border-radius: 99em; padding: .36em .9em .44em; transform: translate(-50%, -135%); }
.chart.is-hover .ctip { opacity: 1; }

/* ---------- close ---------- */
.close__say { font-size: calc(var(--u) * 4.5); line-height: 1.5; font-weight: 800; }
.poster[data-lang="en"] .close__say { font-weight: 600; font-size: calc(var(--u) * 4.5); line-height: 1.3; }
.res { display: flex; align-items: center; gap: calc(var(--u) * 3); }
.res__qr { flex: none; width: calc(var(--u) * 17.5); height: calc(var(--u) * 17.5); background: #fff; padding: calc(var(--u) * 1.4); border-radius: calc(var(--u) * .8); }
.res__qr svg { display: block; width: 100%; height: 100%; }
.res__t { font-size: calc(var(--u) * 3.1); line-height: 1.4; color: var(--fg2); }
.res__t b { display: block; font-size: calc(var(--u) * 3.9); line-height: 1.3; color: var(--fg); }
.res__t span { display: block; }
.res__t .url { font-family: var(--f-num); font-weight: 700; font-size: calc(var(--u) * 4); color: var(--fg); letter-spacing: .01em; }
.src { font-size: calc(var(--u) * 2.3); line-height: 1.45; color: var(--fg3); font-weight: 500; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }
</style>

<!-- ============================================================
     The poster layout: A3, 297 x 420 units. Used for print and for
     wide screens. Narrow screens get the reflowed layout below.
     ============================================================ -->
<style id="css-layout" media="print, screen and (min-width: 1100px)">
.stage { container-type: inline-size; width: min(100%, max(141vh, 1100px)); margin: 0 auto; }
.poster { --u: calc(100cqw / 297); width: calc(var(--u) * 297); height: calc(var(--u) * 420); }
.hero { position: absolute; left: 0; top: 0; width: 100%; height: calc(var(--u) * 236); }
.art { position: absolute; inset: 0; }
.lead { position: absolute; left: calc(var(--u) * 15); top: calc(var(--u) * 13); width: calc(var(--u) * 96); }
.title { --fit-w: 96; }
.story { margin-top: calc(var(--u) * 9); width: calc(var(--u) * 91); }
.call { position: absolute; left: calc(var(--u) * 224); width: calc(var(--u) * 58); }
.call--on { top: calc(var(--u) * 42); }
.call--off { top: calc(var(--u) * 136); }
.legend { position: absolute; left: calc(var(--u) * 118); top: calc(var(--u) * 216); width: calc(var(--u) * 164); }

.know { position: absolute; left: calc(var(--u) * 15); top: calc(var(--u) * 240); width: calc(var(--u) * 267);
  display: grid; grid-template-columns: 74fr 88fr 93fr; column-gap: calc(var(--u) * 6); }
.act { position: absolute; left: calc(var(--u) * 15); top: calc(var(--u) * 307); width: calc(var(--u) * 267);
  display: grid; grid-template-columns: 50fr 57fr 59fr 92fr; column-gap: calc(var(--u) * 3); row-gap: calc(var(--u) * 3.4); }
.act__h { grid-column: 1 / -1; }
.uu { display: grid; grid-template-columns: auto 1fr; column-gap: calc(var(--u) * 5); align-items: start; }
.close { position: absolute; left: calc(var(--u) * 15); top: calc(var(--u) * 386); width: calc(var(--u) * 267);
  display: grid; grid-template-columns: 1fr calc(var(--u) * 92); column-gap: calc(var(--u) * 10); align-items: center;
  border-top: calc(var(--u) * .2) solid var(--rule); padding-top: calc(var(--u) * 2.6); }
.src { grid-column: 1 / -1; margin-top: calc(var(--u) * 2); }
</style>

<!-- ============================================================
     Narrow screens: one column, same components, larger unit.
     ============================================================ -->
<style id="css-compact" media="screen and (max-width: 1099.98px)">
.stage { container-type: inline-size; width: min(100%, 640px); margin: 0 auto; }
.poster { --u: calc(100cqw / 100); padding: calc(var(--u) * 7) calc(var(--u) * 6) calc(var(--u) * 10); font-size: calc(var(--u) * 3.9); }
.hero { display: flex; flex-direction: column; }
.lead { display: contents; }
.title { --fit-w: 88; order: 1; }
.art { position: relative; order: 2; height: calc(var(--u) * 124); margin: calc(var(--u) * 2) calc(var(--u) * -6) 0; }
.leaders { display: none; }
.story { order: 3; margin-top: calc(var(--u) * 2); }
.story h2 { font-size: calc(var(--u) * 9.6); }
.call { order: 4; margin-top: calc(var(--u) * 9); padding-top: calc(var(--u) * 5); border-top: calc(var(--u) * .25) solid var(--rule); }
.call__pct { font-size: calc(var(--u) * 26); }
.call__txt { font-size: calc(var(--u) * 4.8); }
.legend { order: 5; margin-top: calc(var(--u) * 8); font-size: calc(var(--u) * 3.3); gap: calc(var(--u) * 1.4) calc(var(--u) * 4.2); }
.small { font-size: calc(var(--u) * 3.3); }
.know, .act { margin-top: calc(var(--u) * 14); display: grid; row-gap: calc(var(--u) * 11); }
.act { row-gap: calc(var(--u) * 9); }
.act__h { font-size: calc(var(--u) * 5.6); margin-bottom: calc(var(--u) * -3); }
.s p, .s li { font-size: calc(var(--u) * 3.9); }
.s .cap { font-size: calc(var(--u) * 3); }
.routes span { font-size: calc(var(--u) * 3.6); }
.chips button { font-size: calc(var(--u) * 3.9); padding: calc(var(--u) * 1.5) calc(var(--u) * 3.2) calc(var(--u) * 1.7); }
.uu .eq { font-size: calc(var(--u) * 19); }
.uu__cap { font-size: calc(var(--u) * 4.4); }
.chart { margin-top: calc(var(--u) * 5) !important; }
.chart text { font-size: 2.6px; }
.close { margin-top: calc(var(--u) * 14); padding-top: calc(var(--u) * 6); border-top: calc(var(--u) * .25) solid var(--rule); display: grid; row-gap: calc(var(--u) * 6); }
.close__say { font-size: calc(var(--u) * 5); }
.res__qr { width: calc(var(--u) * 26); height: calc(var(--u) * 26); }
.res__t { font-size: calc(var(--u) * 3.5); }
.res__t b { font-size: calc(var(--u) * 4.3); }
.src { font-size: calc(var(--u) * 2.9); }
.tip { font-size: calc(var(--u) * 3.4); }
.chart .ctip { font-size: calc(var(--u) * 3.2); }
</style>

<!-- ============================================================
     Print: exactly one A3 sheet. The live WebGL canvas is swapped
     for a 2D canvas rendered at 3508 px across (300 dpi).
     ============================================================ -->
<style id="css-print" media="print">
@page { size: 297mm 420mm; margin: 0; }
html, body { width: 297mm; height: 420mm; margin: 0 !important; padding: 0 !important; overflow: hidden; background: var(--bg) !important; }
html, body, .poster { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.stage { width: 297mm !important; margin: 0 !important; container-type: normal !important; }
.poster { --u: 1mm; width: 297mm; height: 420mm; break-inside: avoid; break-after: avoid; }
[data-screen] { display: none !important; }
.art__live { display: none !important; }
/* "pixelated" keeps Chrome on its bitmap path: the canvas goes into the PDF as one 3508 px image, alpha intact */
.art__print { display: block !important; image-rendering: pixelated; }
.glow { display: none !important; }
.poster *, .poster *::before, .poster *::after { animation: none !important; transition: none !important; }
.chips button[aria-pressed="true"], .btn[aria-pressed="true"] { background: transparent; color: var(--fg); border-color: var(--rule2); }
.mark--on { box-shadow: none; }
</style>

<!-- ============================================================
     Screen-only chrome: the dock, the afterword, transitions.
     ============================================================ -->
<style id="css-screen" media="screen">
html { scroll-behavior: smooth; }
body { min-height: 100vh; overflow-x: clip; }
.art__live { touch-action: pan-y; }
.hero { cursor: crosshair; }
.lead, .call, .legend { cursor: auto; }

.dock {
  position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
  display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; max-width: calc(100vw - 16px);
  background: color-mix(in srgb, var(--page) 72%, transparent); border: 1px solid var(--rule);
  -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
  font: 600 13px/1 var(--f-text); color: var(--fg); view-transition-name: dock;
}
.dock button {
  appearance: none; font: inherit; color: inherit; background: transparent; border: 0; border-radius: 999px;
  padding: 10px 13px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px;
}
.dock button:hover { background: var(--wash); }
.dock button[aria-pressed="true"] { background: var(--fg); color: var(--page); }
.dock button:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
.dock button[disabled] { opacity: .55; cursor: progress; }
.dock i { width: 1px; height: 18px; background: var(--rule); margin: 0 3px; flex: none; }
.dock .sw { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid currentColor; background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.dock small { font-size: 11px; font-weight: 500; opacity: .62; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) {
  .dock { gap: 1px; padding: 4px; font-size: 12px; }
  .dock button { padding: 10px 9px; }
  .dock small, .dock .lbl-long { display: none; }
  .dock i { margin: 0 1px; }
}

.after { width: min(100% - 40px, 820px); margin: 0 auto; padding: 72px 0 132px; font: 400 15px/1.7 var(--f-text); color: var(--fg2); }
.after h2 { margin: 0 0 14px; font-size: 26px; line-height: 1.2; font-weight: 800; color: var(--fg); }
.after p { margin: 0 0 12px; max-width: 62ch; }
.after ul { margin: 22px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 28px; border-top: 1px solid var(--rule); }
.after li { padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; line-height: 1.5; }
.after li b { display: block; font: 700 22px/1.1 var(--f-num); font-stretch: 75%; color: var(--fg); margin-bottom: 3px; }
.after a { color: var(--fg); text-underline-offset: 3px; }

.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 31; font: 600 13px/1.3 var(--f-text); color: var(--page); background: var(--fg); border-radius: 999px; padding: 10px 16px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: calc(100vw - 32px); text-align: center; }
.toast.is-on { opacity: 1; }

/* the 72 hours tick in, once, when they scroll into view */
@media (prefers-reduced-motion: no-preference) {
  .dots .d72 { opacity: 0; transition: opacity .5s calc(var(--i) * 18ms); }
  .s2.is-in .dots .d72 { opacity: var(--o); }
  .chart .line { stroke-dasharray: 120; stroke-dashoffset: 120; transition: stroke-dashoffset 1.6s .2s ease-out; }
  .s4.is-in .chart .line { stroke-dashoffset: 0; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* language switch: numerals and symbols hold still, the words around them change */
::view-transition-group(*) { animation-duration: .42s; animation-timing-function: cubic-bezier(.3, .7, .2, 1); }
::view-transition-old(*), ::view-transition-new(*) { animation-duration: .42s; }
/* theme switch: the new surface opens from the switch itself */
html.vt-theme [style*="view-transition-name"] { view-transition-name: none !important; }
html.vt-theme::view-transition-old(root) { animation: none; z-index: 0; }
html.vt-theme::view-transition-new(root) { animation: vt-open .8s cubic-bezier(.3, .7, .2, 1) both; z-index: 1; }
@keyframes vt-open { from { clip-path: circle(0 at var(--vx, 50%) var(--vy, 100%)); } to { clip-path: circle(160vmax at var(--vx, 50%) var(--vy, 100%)); } }
@media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
</style>
</head>

/* ================================================================
   4. The art: geometry
      A ribbon is a strip. Its centre line is a spline; 820 ribs of
      50 dots are laid across it on a staggered, lightly jittered
      lattice, so 41,000 dots sit evenly on the band.
   ================================================================ */
const ART = { w: 297, h: 236, cx: 171, cy: 117.5, rh: 176 };          // poster layout, in units
const ART_COMPACT = { w: 100, h: 124, cx: 50, cy: 61, rh: 106 };       // narrow-screen layout
const HALF = 0.066;                                                    // band half width, ribbon height ~ 1
const CTRL = [
  [-0.240, -0.500], [-0.162, -0.348], [-0.084, -0.196], [0.000, -0.036],
  [0.092, 0.132], [0.160, 0.284], [0.122, 0.412], [0.000, 0.460],
  [-0.122, 0.412], [-0.160, 0.284], [-0.092, 0.132], [0.000, -0.036],
  [0.084, -0.196], [0.162, -0.348], [0.240, -0.500]
];

function buildRibbon() {
  // centripetal Catmull-Rom through the control points, then an arc-length table
  const cat = (p0, p1, p2, p3, u) => {
    const d = (a, b) => Math.sqrt(Math.hypot(b[0] - a[0], b[1] - a[1])) || 1e-6;
    const t1 = d(p0, p1), t2 = t1 + d(p1, p2), t3 = t2 + d(p2, p3), tt = t1 + (t2 - t1) * u;
    const L = (a, b, ta, tb) => { const w = (tt - ta) / (tb - ta); return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w]; };
    const A1 = L(p0, p1, 0, t1), A2 = L(p1, p2, t1, t2), A3 = L(p2, p3, t2, t3);
    return L(L(A1, A2, 0, t2), L(A2, A3, t1, t3), t1, t2);
  };
  const n = CTRL.length, ext = (a, b) => [2 * a[0] - b[0], 2 * a[1] - b[1]];
  const all = [ext(CTRL[0], CTRL[1]), ...CTRL, ext(CTRL[n - 1], CTRL[n - 2])], SEG = 240, pts = [];
  for (let i = 0; i < n - 1; i++) for (let k = 0; k < SEG; k++) pts.push(cat(all[i], all[i + 1], all[i + 2], all[i + 3], k / SEG));
  pts.push(CTRL[n - 1].slice());
  const cum = new Float64Array(pts.length);
  for (let i = 1; i < pts.length; i++) cum[i] = cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const total = cum[cum.length - 1];
  const sXA = cum[3 * SEG] / total, sTop = cum[7 * SEG] / total, sXB = cum[11 * SEG] / total;
  const at = f => {                                   // point and unit tangent at arc fraction f
    const target = clamp(f, 0, 1) * total;
    let lo = 0, hi = cum.length - 2;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid - 1; }
    const a = pts[lo], b = pts[lo + 1], seg = cum[lo + 1] - cum[lo] || 1e-9, w = (target - cum[lo]) / seg;
    return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, (b[0] - a[0]) / seg, (b[1] - a[1]) / seg];
  };
  // the strip in 3D: tail A passes behind, tail B in front, and the loop lifts and rolls over the top
  const ZC = 0.034, ZB = 0.05, TW = 0.62;
  const frame = f => {
    const [x, y, tx, ty] = at(f);
    const loop = smooth(sXA, sTop, f) * (1 - smooth(sTop, sXB, f));
    const z = ZC * (2 * smooth(sXA - 0.02, sXB + 0.02, f) - 1) + ZB * loop, psi = TW * loop * loop;
    return { x, y, z, wx: -ty * Math.cos(psi), wy: tx * Math.cos(psi), wz: Math.sin(psi) };
  };
  const rnd = mulberry32(20261201), N = RIBS * ROWS, STR = 8;
  const dots = new Float32Array(N * STR), pitchS = total / RIBS, pitchV = 2 * HALF / ROWS, JIT = 0.34;
  // where the front tail covers the back one, the back dots are dimmed
  const front = []; let fx0 = 1e9, fx1 = -1e9, fy0 = 1e9, fy1 = -1e9;
  for (let i = 0; i <= 150; i++) {
    const f = sXB - 0.09 + 0.2 * i / 150; if (f > 1) break;
    const p = at(f); front.push(p);
    fx0 = Math.min(fx0, p[0]); fx1 = Math.max(fx1, p[0]); fy0 = Math.min(fy0, p[1]); fy1 = Math.max(fy1, p[1]);
  }
  const under = (x, y) => {
    if (x < fx0 - HALF || x > fx1 + HALF || y < fy0 - HALF || y > fy1 + HALF) return false;
    for (let i = 0; i < front.length - 1; i++) {
      const a = front[i], b = front[i + 1], dx = b[0] - a[0], dy = b[1] - a[1];
      const u = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy), 0, 1);
      if (Math.hypot(x - a[0] - dx * u, y - a[1] - dy * u) < HALF * 0.985) return true;
    }
    return false;
  };
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, o = 0;
  for (let i = 0; i < RIBS; i++) for (let j = 0; j < ROWS; j++) {
    const f = (i + 0.5 + (rnd() - 0.5) * JIT) / RIBS;
    const v = -HALF + (j + 0.25 + 0.5 * (i & 1) + (rnd() - 0.5) * JIT) * pitchV;
    const F = frame(f), Fa = frame(f - 0.5 / RIBS), Fb = frame(f + 0.5 / RIBS);
    const x = F.x + F.wx * v, y = F.y + F.wy * v, z = F.z + F.wz * v;
    // bending the strip in its own plane squeezes the inner edge; dot size follows the local area
    const stretch = Math.hypot((Fb.x + Fb.wx * v) - (Fa.x + Fa.wx * v), (Fb.y + Fb.wy * v) - (Fa.y + Fa.wy * v)) / pitchS;
    const area = Math.max(0.2, stretch * Math.hypot(F.wx, F.wy));
    dots[o++] = x; dots[o++] = y; dots[o++] = z;
    dots[o++] = (i + 0.5) / RIBS;
    dots[o++] = clamp(Math.sqrt(area), 0.55, 1.25);
    dots[o++] = (f < sTop && f > sXA - 0.12 && under(x, y)) ? 1 : 0;
    dots[o++] = rnd(); dots[o++] = rnd();
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  // centre and scale so the ribbon is exactly 1 unit tall
  const hgt = y1 - y0, mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  for (let k = 0; k < N; k++) { dots[k * STR] = (dots[k * STR] - mx) / hgt; dots[k * STR + 1] = (dots[k * STR + 1] - my) / hgt; dots[k * STR + 2] /= hgt; }
  // rib centres and band edges: for picking, leader lines and the tint under the lit part
  const mid = new Float32Array((RIBS + 1) * 3), edge = new Float32Array((RIBS + 1) * 8);
  for (let i = 0; i <= RIBS; i++) {
    const F = frame(i / RIBS), X = v => (v - mx) / hgt, Y = v => (v - my) / hgt;
    mid.set([X(F.x), Y(F.y), F.z / hgt], i * 3);
    edge.set([X(F.x - F.wx * HALF), Y(F.y - F.wy * HALF), (F.z - F.wz * HALF) / hgt, i / RIBS,
              X(F.x + F.wx * HALF), Y(F.y + F.wy * HALF), (F.z + F.wz * HALF) / hgt, i / RIBS], i * 8);
  }
  return { dots, mid, edge, N, STR, pitch: pitchS / hgt, half: HALF / hgt };
}

// 44,200 faint dots gathered around the ribbon, thinning toward the edges
function buildMemorial(art) {
  const rnd = mulberry32(19810605), mem = new Float32Array(MEM * 5), k0 = art.rh / 176;
  const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 0.5774;
  for (let k = 0; k < MEM;) {
    let x, y;
    if (rnd() < 0.8) { x = art.cx + gauss() * 58 * k0; y = art.cy + gauss() * 54 * k0; }
    else { x = rnd() * art.w; y = rnd() * art.h; }
    if (x < 0 || x > art.w || y < 0 || y > art.h) continue;
    if (rnd() < smooth(art.h - 46 * k0, art.h - 2, y)) continue;
    mem[k * 5] = x / art.w; mem[k * 5 + 1] = y / art.h;
    mem[k * 5 + 2] = (0.55 + rnd() * rnd() * 1.5) * k0;
    mem[k * 5 + 3] = rnd(); mem[k * 5 + 4] = rnd();
    k++;
  }
  return mem;
}

// the same transform the vertex shader applies, for picking and for the leader lines
function project(x, y, z, art, yaw, pitch) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const X = cy * x + sy * z, Z0 = cy * z - sy * x, Y = cp * y - sp * Z0, Z = cp * Z0 + sp * y, k = 1 / (1 - Z * 0.6);
  return [art.cx + X * k * art.rh, art.cy - Y * k * art.rh];
}

  printCanvas.getContext('2d').drawImage(off, 0, 0);       // a single bitmap blit, so nothing else ends up in the print record
  printKey = key;
}
// phones cap canvas area well below 17 megapixels; desktop browsers do not
const printScale = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent)) ? 0.8 : 1;
addEventListener('beforeprint', () => { posterMode(true); drawPrintArt(printScale()); });
addEventListener('afterprint', () => posterMode(false));

const CRC = (() => { const tb = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c >>> 0; } return tb; })();
const crc32 = bytes => { let c = 0xFFFFFFFF; for (const b of bytes) c = CRC[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
// write the resolution into the file: a pHYs chunk, pixels per metre, right after IHDR
async function tagDPI(blob, dpi) {
  const src = new Uint8Array(await blob.arrayBuffer()), parts = [src.subarray(0, 33)], ppm = Math.round(dpi / 0.0254);
  const ch = new Uint8Array(21), dv = new DataView(ch.buffer);
  dv.setUint32(0, 9); ch.set([112, 72, 89, 115], 4); dv.setUint32(8, ppm); dv.setUint32(12, ppm); ch[16] = 1;
  dv.setUint32(17, crc32(ch.subarray(4, 17)));
  parts.push(ch);
  for (let p = 33; p < src.length;) {                     // copy the rest, dropping any pHYs already there
    const len = new DataView(src.buffer, src.byteOffset + p, 4).getUint32(0), end = p + 12 + len;
    if (String.fromCharCode(...src.subarray(p + 4, p + 8)) !== 'pHYs') parts.push(src.subarray(p, end));
    p = end;
  }
  return new Blob(parts, { type: 'image/png' });
}
function posterSVG() {
  const clone = poster.cloneNode(true);
  $$('[data-screen], canvas, .sr', clone).forEach(n => n.remove());
  $$('[style]', clone).forEach(n => n.style.removeProperty('view-transition-name'));
  clone.style.cssText += ';background:transparent;margin:0;';
  const style = document.createElement('style');
  style.textContent = ['css-base', 'css-layout', 'css-print'].map(id => $('#' + id).textContent).join('\n');
  const wrap = document.createElement('div');
  wrap.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
  wrap.append(style, clone);
  const mm = 96 / 25.4, vw = A3.w * mm, vh = A3.h * mm;
  const xml = new XMLSerializer().serializeToString(wrap);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${A3.px}" height="${A3.py}" viewBox="0 0 ${vw} ${vh}"><foreignObject x="0" y="0" width="${vw}" height="${vh}">${xml}</foreignObject></svg>`;
}
async function renderPNG() {
  posterMode(true);
  try {
    await new Promise(r => requestAnimationFrame(() => r()));
    const W = A3.px, H = A3.py, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = getComputedStyle(poster).backgroundColor; ctx.fillRect(0, 0, W, H);
    const art = document.createElement('canvas'); art.width = W; art.height = Math.round(W * ART.h / ART.w);
    draw2D(art.getContext('2d'), art.width, art.height, { art: ART, mem: memFor(ART), theme: S.theme, lit: LIT });
    ctx.drawImage(art, 0, 0);
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(posterSVG());
    await img.decode();
    ctx.drawImage(img, 0, 0, W, H);
    const blob = await new Promise((ok, no) => cv.toBlob(b => b ? ok(b) : no(new Error('toBlob')), 'image/png'));
    return await tagDPI(blob, A3.dpi);
  } finally { posterMode(false); }
}
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('is-on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('is-on'), 4200); }
async function savePNG() {
  const btn = $('#btn-png'), lbl = $('#lbl-png'); btn.disabled = true; lbl.textContent = t('dBusy');
  try {
    await new Promise(r => setTimeout(r, 40));
    const blob = await renderPNG(), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `world-aids-day-2026_${S.lang}_${S.theme}_A3_300dpi.png`;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 20000);
    toast(t('tDone'));
  } catch (err) { console.error(err); toast(t('tFail')); }
  btn.disabled = false; lbl.textContent = t('dPng');
}

/* ================================================================
   10. Start
   ================================================================ */
function boot() {
  const q = new URLSearchParams(location.search), nav = (navigator.languages || [navigator.language || 'en']).map(l => l.toLowerCase());
  const guess = () => { for (const l of nav) { if (l.startsWith('ja')) return 'ja'; if (l.startsWith('zh')) return 'zh'; if (l.startsWith('en')) return 'en'; } return 'en'; };
  S.lang = [q.get('lang'), store.get('aids.lang'), guess()].find(l => LANGS.includes(l));
  S.theme = [q.get('theme'), store.get('aids.theme'), 'night'].find(v => v === 'night' || v === 'paper');
  const mq = matchMedia('(max-width: 1099.98px)');
  S.compact = mq.matches;
  mq.addEventListener('change', e => { S.compact = e.matches; staticDirty = true; fitText(); sizeCanvas(); kick(); });

  RIB = buildRibbon();
  renderDots72();
  applyTheme(); applyLang();
  $$('[data-vt]').forEach((el, i) => { el.style.viewTransitionName = 'b' + i; });

  try { renderer = createGL(liveCanvas); } catch (err) { console.warn('WebGL unavailable, drawing a still frame instead.', err); renderer = null; }
  if (!renderer) { fallback2D = true; S.intro = 1; S.introDone = true; S.lit = LIT; renderCallouts(); $('#glow').style.display = 'none'; }
  sizeCanvas(); updateLeaders(0, 0); litGlow();
  new ResizeObserver(() => { sizeCanvas(); fitText(); kick(); }).observe(artEl);
  new IntersectionObserver(es => { heroVisible = es[0].isIntersecting; if (heroVisible) kick(); }, { rootMargin: '120px' }).observe(hero);
  const seen = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); seen.unobserve(e.target); } }), { threshold: 0.4 });
  $$('.s2, .s4').forEach(el => seen.observe(el));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) kick(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

  hero.addEventListener('pointermove', e => pointer(e, false));
  hero.addEventListener('pointerdown', e => pointer(e, true));
  hero.addEventListener('pointerleave', () => { S.hover = false; S.lensOn = false; $('#lens').style.opacity = 0; showTip(null); kick(); });
  for (const type of ['pointerup', 'pointercancel']) hero.addEventListener(type, e => { if (e.pointerType !== 'mouse') S.hover = false; });
  $('#btn-all').addEventListener('click', toggleAll);
  $('#chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; chip = chip === +b.dataset.k ? -1 : +b.dataset.k; renderWhy(); });
  $$('[data-set-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.setLang)));
  $('#btn-theme').addEventListener('click', e => setTheme(S.theme === 'night' ? 'paper' : 'night', e.currentTarget));
  $('#btn-print').addEventListener('click', () => window.print());
  $('#btn-png').addEventListener('click', savePNG);

  // the chart answers the pointer: a crosshair snaps to the nearest month
  $('#chart').addEventListener('pointermove', e => {
    const svg = $('#chart svg'), r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * CH.w;
    const mth = clamp(Math.round((x - CH.l) / (CH.r - CH.l) * 6), 0, 6), v = VL[mth];
    $('#chart').classList.add('is-hover');
    const cx = chX(mth), cy = chY(v), ln = $('#ch-x'), hot = $('#ch-hot'), tip = $('#ch-tip');
    ln.setAttribute('x1', cx); ln.setAttribute('x2', cx); hot.setAttribute('cx', cx); hot.setAttribute('cy', cy);
    const n = v >= 1000 ? Math.round(v / 1000) * 1000 : v, txt = S.lang === 'en' ? n.toLocaleString('en-US') : (n >= 10000 ? n / 10000 + '万' : n.toLocaleString('en-US'));
    tip.textContent = (mth ? t('cTip') : t('cTip0')).replace('{m}', mth).replace('{v}', txt);
    tip.style.left = cx / CH.w * 100 + '%'; tip.style.top = cy / CH.h * r.height + 'px';
  });
  $('#chart').addEventListener('pointerleave', () => $('#chart').classList.remove('is-hover'));

  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function' && !REDUCED) {
    let base = null;
    addEventListener('deviceorientation', e => {
      if (e.gamma == null || e.beta == null) return;
      if (!base) base = [e.gamma, e.beta];
      S.tiltX = clamp((e.gamma - base[0]) / 90, -0.4, 0.4); S.tiltY = clamp((e.beta - base[1]) / -180, -0.18, 0.18);
    });
  }
  setInterval(() => { if (!document.hidden && !S.poster) renderLive(); }, 1000);
  setInterval(renderCountdown, 60000);
  kick();
}
boot();
})();
